# xiboplayer + Xibo CMS on one domain.
#
#   PWA + proxy routes  → xiboplayer container (docker compose, port 8765)
#   everything else     → Xibo CMS
#
# Edit the two upstreams and server_name, then drop this in
# /etc/nginx/conf.d/ (or sites-available/) and run certbot as usual.

upstream xiboplayer {
    server 127.0.0.1:8765;          # docker compose HOST_PORT
}

upstream xibo_cms {
    server 127.0.0.1:8080;          # your Xibo CMS
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name signage.example.org;

    client_max_body_size 2g;        # CMS library uploads

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── PWA (app, service worker, cache-through player API) ─────────────────
    location ^~ /player/ {
        proxy_pass http://xiboplayer;
        proxy_buffering off;
    }

    # ── Proxy endpoints the PWA calls from the site root ────────────────────
    location ~ ^/(xmds-proxy|stream-proxy|config|auth-token|store|system|debug|shell-command|sync)(/|$) {
        proxy_pass http://xiboplayer;
        proxy_buffering off;
    }

    # Ctrl+Q on any display would restart the shared player server
    location = /quit {
        return 204;
    }

    # ── Everything else: Xibo CMS ───────────────────────────────────────────
    location / {
        proxy_pass http://xibo_cms;
    }
}
